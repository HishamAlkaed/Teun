[workspace]
resolver = "2"
members = [
    "apps/teun/service",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.92"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Error handling
anyhow = "1"
# Logging / tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
# OpenTelemetry (exports traces to Langfuse via OTLP/HTTP).
# The SDK's batch span processor runs on a dedicated non-Tokio thread and drives
# the exporter with `futures_executor::block_on`. An async HTTP client panics
# there ("no reactor running") and every span is silently dropped, so we use the
# BLOCKING reqwest client, which runs synchronously without a Tokio reactor.
# Enable ONLY reqwest-blocking-client: turning on reqwest-client as well makes the
# exporter's default-client selection compile out both branches (NoHttpClient).
opentelemetry = "0.29"
opentelemetry_sdk = { version = "0.29" }
opentelemetry-otlp = { version = "0.29", default-features = false, features = ["http-proto", "reqwest-blocking-client", "reqwest-rustls"] }
tracing-opentelemetry = "0.30"
base64 = "0.22"
# HTTP
axum = "0.8"
reqwest = { version = "0.12", features = ["json", "stream"] }
# UUID
uuid = { version = "1", features = ["v4", "serde"] }
# Time
chrono = { version = "0.4", features = ["serde"] }
