name: Teun

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
    tags: ["v*"]
  pull_request:

env:
  REGISTRY: registry.nextepoch.cloud
  IMAGE: orgs/dmfco/teun

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: https://github.com/dtolnay/rust-toolchain@stable

      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-teun-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-teun-

      - name: Run Rust unit tests
        run: cargo test -p teun

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/teun/web/package-lock.json

      - name: Install web dependencies
        run: npm ci
        working-directory: apps/teun/web

      - name: Run web unit tests
        run: npm test
        working-directory: apps/teun/web

  build-and-push:
    needs: test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Determine image tag
        id: meta
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "tags=${{ env.REGISTRY }}/${{ env.IMAGE }}:${GITHUB_REF#refs/tags/},${{ env.REGISTRY }}/${{ env.IMAGE }}:latest" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref }}" == refs/heads/develop ]]; then
            echo "tags=${{ env.REGISTRY }}/${{ env.IMAGE }}:develop" >> "$GITHUB_OUTPUT"
          else
            echo "tags=${{ env.REGISTRY }}/${{ env.IMAGE }}:latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to NextEpoch Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/teun/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
