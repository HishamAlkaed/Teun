[package]
name = "teun"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Teun API - AI mortgage advice assistant"

[[bin]]
name = "teun"
path = "src/main.rs"

[[bin]]
name = "ingest"
path = "src/bin/ingest.rs"

[dependencies]
axum = { workspace = true, features = ["multipart"] }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true }
opentelemetry-otlp = { workspace = true }
tracing-opentelemetry = { workspace = true }
base64 = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "chrono", "json", "uuid"] }
tower-http = { version = "0.6", features = ["cors", "trace", "fs"] }
tower_governor = { version = "0.8", features = ["axum"] }
reqwest = { workspace = true }
futures = "0.3"
tokio-stream = "0.1"
pdfium-render = "0.9"
pgvector = { version = "0.4", features = ["sqlx"] }
tiktoken-rs = "0.12"
text-splitter = { version = "0.32", features = ["tiktoken-rs"] }
